version: '3.8'

services:
  backend:
    build:
      context: ./sih-backend
    container_name: sih-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./sih-backend/.env
    environment:
      - HOST=0.0.0.0

  bot:
    build:
      context: ./sih-telegram-bot
    container_name: sih-telegram-bot
    restart: unless-stopped
    env_file:
      - ./sih-telegram-bot/.env
    depends_on:
      - backend

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.7
    container_name: sih-keycloak
    restart: unless-stopped
    environment:
      KC_DB: postgres
      KC_DB_URL: ${SUPABASE_DB_URL}
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${SUPABASE_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY: edge
    command: start --optimized
    ports:
      - "8080:8080"
